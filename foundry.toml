[profile.default]
solc = '0.8.28'
bytecode_hash = "none"
evm_version = 'cancun'
via_ir = true
optimizer_runs = 200
libs = ["node_modules", "lib"]
fs_permissions = [{ access = "read-write", path = "./"}]

[rpc_endpoints]
ethereum = "${RPC_ETHEREUM_MAINNET}"

[fuzz]
runs = 4096

[invariant]
runs = 1024
depth = 100
fail_on_revert = false

[lint]
# Detectors forge 1.8 added or now runs by default. They flag this codebase's intended patterns
# (per-tier loops, SVG string building, timestamp-driven game phases) and need their own triage
# before they gate CI.
exclude_lints = [
  "pascal-case-struct",
  "mixed-case-variable",
  "block-timestamp",
  "calls-loop",
  "encode-packed-collision",
  "environment-read-across-mutation",
  "missing-events-arithmetic",
  "missing-zero-check",
  "reentrancy-events",
  "reentrancy-no-eth",
  "require-revert-in-loop",
  "uninitialized-local",
  "unsafe-typecast",
  "unused-return",
]
[fmt]
number_underscore = "thousands"
multiline_func_header = "all"
wrap_comments = true
